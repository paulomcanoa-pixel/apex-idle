<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex • Design de monopostos</title><style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#091319;color:#e8f0f3;font:14px Arial}header{max-width:1200px;margin:0 auto 35px}small{color:#a0b2bc;letter-spacing:3px;font-size:10px}h1{font-size:42px;font-style:italic;letter-spacing:-2px;margin:12px 0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:1200px;margin:auto}article{border:1px solid #ffffff16;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#233742,#101b23)}canvas{width:100%;height:auto;display:block}article footer{padding:20px;border-top:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}h2{font-size:16px;margin:0}button,a{border:1px solid #ffffff30;background:#182b36;color:white;border-radius:6px;padding:10px;cursor:pointer;text-decoration:none}p{color:#8fa6b3;font-size:12px}button:hover{border-color:#d4fc5a}</style><header><small>APEX MOTORSPORT / DESIGN STUDIO</small><h1>Cinco carros. Cinco identidades.</h1><p>Arte original em Canvas · vista superior · PNG com fundo transparente</p><a href="index.html">← Voltar ao jogo</a></header><main id="gallery"></main><script src="car-art.js"></script><script>CarArt.models.forEach((m,i)=>{const card=document.createElement('article'),c=document.createElement('canvas');c.width=600;c.height=560;CarArt.draw(c.getContext('2d'),{x:300,y:280,a:-Math.PI/2,scale:5,id:m.id,number:String(i+1).padStart(2,'0'),shadow:false});const footer=document.createElement('footer'),name=document.createElement('h2'),b=document.createElement('button');name.textContent=m.name;name.style.color=m.color;b.textContent='↓ PNG';b.onclick=()=>{const a=document.createElement('a');a.download=m.id+'.png';a.href=c.toDataURL('image/png');a.click()};footer.append(name,b);card.append(c,footer);document.getElementById('gallery').append(card)});</script></html>
